name: EdgeCast Agent Dispatch

on:
  issues:
    types: [labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to route"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: edgecast-agent-dispatch-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  route:
    name: GREEN / YELLOW / RED routing
    runs-on: ubuntu-latest
    steps:
      - name: Resolve issue and classification
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number ?? Number('${{ inputs.issue_number }}');
            if (!issueNumber) core.setFailed('No issue number was provided.');

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name).filter(Boolean);

            const labelSpecs = [
              ['risk-green', '0e8a16', 'GREEN: autonomous engineering repair may be prepared as a PR'],
              ['risk-yellow', 'd4a72c', 'YELLOW: investigation allowed; owner approval required before behavioral activation'],
              ['risk-red', 'b60205', 'RED: autonomous implementation/activation prohibited'],
              ['owner-approval-required', 'fbca04', 'Owner approval is required before merge/activation'],
              ['agent-ready', '1d76db', 'Eligible for cloud coding-agent assignment'],
              ['agent-token-needed', 'cfd3d7', 'Cloud agent dispatch is prepared but repository token/configuration is still needed'],
              ['agent-dispatch-not-confirmed', 'fbca04', 'Dispatch was requested but no verifiable assignment/PR post-condition was observed yet'],
              ['agent-stalled', 'b60205', 'Autonomous dispatch/repair appears stalled and needs system attention'],
            ];
            for (const [name, color, description] of labelSpecs) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else throw error;
              }
            }

            let classification = 'NONE';
            if (labels.includes('safety-block') || labels.includes('risk-red')) {
              classification = 'RED';
            } else if (labels.includes('yellow-candidate') || labels.includes('risk-yellow')) {
              classification = 'YELLOW';
            } else if (labels.includes('green-candidate') || labels.includes('risk-green')) {
              classification = 'GREEN';
            }

            const desired = new Set(labels);
            for (const l of ['risk-green', 'risk-yellow', 'risk-red', 'owner-approval-required', 'agent-ready', 'agent-token-needed', 'agent-dispatch-not-confirmed', 'agent-stalled']) desired.delete(l);

            if (classification === 'GREEN') {
              desired.add('risk-green');
              desired.add('agent-ready');
            } else if (classification === 'YELLOW') {
              desired.add('risk-yellow');
              desired.add('owner-approval-required');
            } else if (classification === 'RED') {
              desired.add('risk-red');
              desired.add('owner-approval-required');
            }

            await github.rest.issues.update({ owner, repo, issue_number: issueNumber, labels: [...desired] });

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('classification', classification);

            if (classification === 'YELLOW' || classification === 'RED') {
              const marker = `<!-- edgecast-route-${classification.toLowerCase()} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
              if (!comments.some(c => (c.body || '').includes(marker))) {
                const message = classification === 'YELLOW'
                  ? `${marker}\n🟡 **YELLOW — OWNER APPROVAL REQUIRED**\n\nAutomated engineering may investigate and prepare evidence, but this issue must not be behaviorally activated, merged, or deployed without explicit owner approval under \`AGENTS.md\`.`
                  : `${marker}\n🔴 **RED — AUTONOMOUS IMPLEMENTATION STOPPED**\n\nThis issue crosses an EdgeCast safety/integrity boundary. No cloud coding agent will be assigned automatically. Real-money execution remains prohibited and any permitted next step requires explicit owner review under \`AGENTS.md\`.`;
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: message });
              }
            }

      - name: Dispatch GREEN issue to Copilot cloud agent
        id: dispatch_green
        if: steps.classify.outputs.classification == 'GREEN'
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.classify.outputs.issue_number }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u

          if [ -z "${COPILOT_AGENT_TOKEN:-}" ]; then
            echo "COPILOT_AGENT_TOKEN is not configured; leaving issue agent-ready."
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          payload=$(cat <<JSON
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${GH_REPOSITORY}",
              "base_branch": "main",
              "custom_instructions": "Read AGENTS.md and COLLABORATION.md first. This issue was routed GREEN. Use the EdgeCast Green Repair policy: make only the smallest behavior-preserving engineering repair, run tests/typecheck/build, open a PR, never merge/deploy, and stop/escalate if the required repair is YELLOW or RED. Never change real-money behavior."
            }
          }
          JSON
          )

          http_code=$(curl -sS -o /tmp/copilot-response.json -w "%{http_code}" \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${COPILOT_AGENT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -d "$payload")

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Copilot assignment failed with HTTP ${http_code}."
            cat /tmp/copilot-response.json
            echo "status=request_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "GREEN issue ${ISSUE_NUMBER} assigned to Copilot cloud agent."
          echo "status=requested" >> "$GITHUB_OUTPUT"

      - name: Record GREEN dispatch state
        id: record_green_state
        if: always() && steps.classify.outputs.classification == 'GREEN'
        uses: actions/github-script@v7
        env:
          DISPATCH_REQUEST_STATUS: ${{ steps.dispatch_green.outputs.status }}
          ISSUE_NUMBER: ${{ steps.classify.outputs.issue_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const requestStatus = process.env.DISPATCH_REQUEST_STATUS || 'request_failed';
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = new Set(issue.labels.map(l => typeof l === 'string' ? l : l.name).filter(Boolean));
            const assigneeObserved = (issue.assignees || []).some(a => a && a.login === 'copilot-swe-agent[bot]');
            let linkedPrObserved = Boolean(issue.pull_request);

            try {
              const events = await github.paginate(
                github.rest.issues.listEvents,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );
              linkedPrObserved = linkedPrObserved || events.some(event =>
                event?.event === 'cross-referenced' && Boolean(event?.source?.issue?.pull_request)
              );
            } catch (error) {
              core.info(`Unable to read issue timeline for PR cross-reference verification: ${error?.message || error}`);
            }

            labels.delete('agent-token-needed');
            labels.delete('agent-dispatch-not-confirmed');
            labels.delete('agent-stalled');

            let dispatchState = 'dispatch_failed';
            if (requestStatus === 'token_missing') {
              labels.add('agent-token-needed');
              dispatchState = 'token_missing';
            } else if (requestStatus === 'requested') {
              if (assigneeObserved || linkedPrObserved) {
                dispatchState = 'dispatched';
              } else {
                labels.add('agent-dispatch-not-confirmed');
                labels.add('agent-stalled');
                dispatchState = 'requested_not_confirmed';
              }
            } else {
              labels.add('agent-stalled');
            }

            await github.rest.issues.update({ owner, repo, issue_number: issueNumber, labels: [...labels] });

            const marker = '<!-- edgecast-green-dispatch -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            const existing = comments.find(c => (c.body || '').includes(marker));

            let body;
            if (dispatchState === 'dispatched') {
              body = `${marker}\n🟢 **GREEN — CLOUD REPAIR DISPATCHED**\n\nDispatch was verified by an observable post-condition (Copilot assignee or implementation PR signal) after the assignment request. The cloud agent may perform GREEN-only repair prep and open a PR, but it may not merge or deploy.`;
            } else if (dispatchState === 'token_missing') {
              body = `${marker}\n🟢 **GREEN — AGENT READY**\n\nThis issue is eligible for autonomous repair, but \`COPILOT_AGENT_TOKEN\` is not configured yet. The repository will keep the issue ready without making unsafe substitutions. Once the token is configured, reapply the \`green-candidate\` label or run EdgeCast Agent Dispatch manually.`;
            } else if (dispatchState === 'requested_not_confirmed') {
              body = `${marker}\n🟠 **GREEN — DISPATCH REQUESTED — NOT CONFIRMED**\n\nA dispatch request was sent, but no verifiable post-condition (Copilot assignee/session/implementation PR signal) is observable yet. This is treated as fail-closed and routed to retry/system-attention handling.`;
            } else {
              body = `${marker}\n🔴 **GREEN — DISPATCH FAILED / STALLED**\n\nCopilot assignment did not complete successfully. No autonomous work claim is being made. The issue remains safely blocked from false \"working\" state and needs dispatch-system attention.`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

            core.setOutput('dispatch_state', dispatchState);

      - name: Fail workflow when dispatch was not verifiably confirmed
        if: steps.classify.outputs.classification == 'GREEN' && steps.record_green_state.outputs.dispatch_state != 'dispatched' && steps.record_green_state.outputs.dispatch_state != 'token_missing'
        shell: bash
        run: |
          echo "GREEN dispatch was not verifiably confirmed; failing closed."
          exit 1
