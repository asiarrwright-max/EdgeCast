name: EdgeCast Approved YELLOW Dispatch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Approved YELLOW issue number to dispatch"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: edgecast-approved-yellow-dispatch-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch explicitly approved YELLOW work
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'owner-approved-yellow'
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit owner approval and safety state
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue?.number ?? Number('${{ inputs.issue_number }}');
            if (!issueNumber) {
              core.setFailed('No issue number was provided.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = issue.labels.map(l => typeof l === 'string' ? l : l.name).filter(Boolean);

            const isYellow = labels.includes('risk-yellow');
            const ownerApproved = labels.includes('owner-approved-yellow');
            const blocked = labels.includes('risk-red') || labels.includes('safety-block');

            if (!isYellow || !ownerApproved || blocked) {
              core.setFailed(`Fail closed: issue #${issueNumber} is not an explicitly owner-approved, unblocked YELLOW issue.`);
              return;
            }

            core.setOutput('issue_number', String(issueNumber));

      - name: Assign approved YELLOW issue to Copilot cloud agent
        id: assign
        if: steps.verify.outcome == 'success'
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.verify.outputs.issue_number }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u

          if [ -z "${COPILOT_AGENT_TOKEN:-}" ]; then
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          payload=$(cat <<JSON
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${GH_REPOSITORY}",
              "base_branch": "main",
              "custom_instructions": "Read EDGECAST_VISION.md, AGENTS.md, and COLLABORATION.md first. The repository owner explicitly approved this YELLOW issue. Implement and test only the exact approved scope described in the issue and its approval record, then open a PR. Do not merge or deploy. Do not broaden forecasting, calibration, eligibility, settlement, recommendation, readiness-threshold, financial-risk, or real-money behavior beyond the specific approval. Real-money order placement remains prohibited. If implementation reveals a new protected decision or requires scope beyond the approval, stop and surface it for a new owner decision."
            }
          }
          JSON
          )

          http_code=$(curl -sS -o /tmp/copilot-response.json -w "%{http_code}" \
            -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${COPILOT_AGENT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -d "$payload")

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "status=dispatched" >> "$GITHUB_OUTPUT"
          else
            echo "Copilot assignment failed with HTTP ${http_code}."
            cat /tmp/copilot-response.json
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Record truthful dispatch state
        if: always() && steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.verify.outputs.issue_number }}
          DISPATCH_STATUS: ${{ steps.assign.outputs.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const status = process.env.DISPATCH_STATUS || 'failed';
            const marker = '<!-- edgecast-approved-yellow-dispatch -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            const existing = comments.find(c => (c.body || '').includes(marker));

            let body;
            if (status === 'dispatched') {
              body = `${marker}\n🟡 **APPROVED YELLOW — CLOUD WORK STARTED**\n\nThe owner's scoped YELLOW approval was verified and Copilot was actually assigned. The agent may implement/test only the approved scope and open a PR. It may not merge, deploy, enable real-money execution, or broaden protected behavior without a new owner decision.`;
            } else if (status === 'token_missing') {
              body = `${marker}\n🟡 **APPROVED YELLOW — DISPATCH BLOCKED**\n\nOwner approval is recorded, but \`COPILOT_AGENT_TOKEN\` is not configured. No agent assignment was claimed. The issue remains blocked pending valid dispatch credentials.`;
            } else {
              body = `${marker}\n🟡 **APPROVED YELLOW — DISPATCH FAILED**\n\nOwner approval is recorded, but Copilot assignment did not succeed. No agent assignment was claimed. The issue remains safely blocked and needs dispatch-system attention.`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }

      - name: Fail workflow when dispatch did not succeed
        if: steps.verify.outcome == 'success' && steps.assign.outputs.status != 'dispatched'
        shell: bash
        run: |
          echo "Approved YELLOW dispatch did not succeed; failing closed."
          exit 1
